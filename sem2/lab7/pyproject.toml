[project]
name = "lab7"
version = "0.1.0"
description = "Educational multilingual toxicity NLP pipeline: preparation, models, metrics"
readme = "README.md"
authors = [
    { name = "Roman Sadovets", email = "r.sadovec555@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
]

[project.optional-dependencies]
nlp = [
    "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5",
    "spacy==3.8.7", "torch==2.7.1", "transformers==4.53.3", "gensim==4.4.0",
    "sentencepiece==0.2.1", "srsly==2.5.1", "murmurhash==1.0.12",
    "cymem==2.0.11", "preshed==3.0.10", "blis==1.3.0", "thinc==8.3.6",
    "pydantic==2.11.7", "pyzmq==27.0.0", "tornado==6.5.1",
    "kiwisolver==1.4.8", "pillow==11.2.1", "rpds-py==0.26.0",
    "regex==2024.11.6", "ipython==9.4.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
lab7 = "lab7:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
